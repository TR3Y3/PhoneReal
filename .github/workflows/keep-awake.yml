name: Keep PhoneReal awake

# Render's free tier sleeps a service after 15 minutes with no traffic, and the
# next visitor then waits ~50 seconds for it to boot. This pings it every 10
# minutes during business hours so reps always hit a warm service.
#
# Times are UTC (GitHub cron has no timezone or DST support). 11:00-22:00 UTC
# covers 7am-5pm Eastern in both EST (UTC-5) and EDT (UTC-4), with an hour of
# margin on each end so the window is right year-round.
on:
  schedule:
    - cron: '*/10 11-22 * * 1-5'
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        run: |
          URL="https://phonereal.onrender.com/api/health"

          # A sleeping service can take ~50s to boot, so allow a long timeout
          # and retry a couple of times before calling it a real failure.
          for attempt in 1 2 3; do
            echo "Attempt $attempt..."
            CODE=$(curl -sS -o /tmp/body.txt -w '%{http_code}' --max-time 90 "$URL" || echo "000")

            if [ "$CODE" = "200" ]; then
              echo "Awake (HTTP $CODE): $(cat /tmp/body.txt)"
              exit 0
            fi

            echo "Got HTTP $CODE, retrying in 15s..."
            sleep 15
          done

          echo "::error::PhoneReal did not respond with 200 after 3 attempts (last code: $CODE)"
          exit 1
